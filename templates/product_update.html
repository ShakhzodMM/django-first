{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block title %}
    E'lonni tahrirlash - {{pr.title}}
{% endblock title %}

{% block content %}
    <div class="container">
        <div class="row">
            <div class="col"></div>
            <div class="col-6 mt-5">
                <h2>E'lonni tahrirlash - {{pr.title}}</h2>
                <form method ="post" enctype="multipart/form-data">{% csrf_token %}
                    {{ form|crispy }}
                    <button type="submit" class="btn btn-primary">Saqlash</button>
                    <a class="btn btn-danger" href="{% url 'products:delete' pr.id %}">O'chirish</a>
                    <a class="btn btn-secondary" href="{% url 'products:detail' pr.id %}">E'longa qaytish</a>
                </form>
            </div>
            <div class="col"></div>
        </div>
    </div>
{% endblock content %}
