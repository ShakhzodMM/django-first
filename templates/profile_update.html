{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block title %}
    Profilni tahrirlash - {{request.user}}
{% endblock title %}

{% block content %}
    <div class="container">
        <div class="row">
            <div class="col"></div>
            <div class="col-6 mt-5">
                <h2>Profilni tahrirlash - {{request.user}}</h2>
                <form method ="post" enctype="multipart/form-data">{% csrf_token %}
                    {{ form|crispy }}
                    <button type="submit" class="btn btn-primary">Saqlash</button>
                    <a class="btn btn-secondary" href="{% url 'users:profile' request.user.username %}">Ortga</a>
                </form>
            </div>
            <div class="col"></div>
        </div>
    </div>
{% endblock content %}
