{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block title %}
    Yangi e'lon
{% endblock title %}

{% block content %}
    <div class="container">
        <div class="row">
            <div class="col"></div>
            <div class="col-6 mt-5">
                <h2>Yangi e'lon joylash</h2>
                <form method ="post" enctype="multipart/form-data">{% csrf_token %}
                    {{ form|crispy }}
                    <button type="submit" class="btn btn-primary">Joylash</button>
                    <a class="btn btn-secondary" href="{% url 'main:index' %}">Bosh sahifaga qaytish</a>
                </form>
            </div>
            <div class="col"></div>
        </div>
    </div>
{% endblock content %}
